name: Deploy game to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Test game rules, resources and hosted paths
        run: npm test
      - name: Verify assets and licenses
        run: npm run verify
      - name: Build static game
        run: npm run build:pages -- --base-path /mindrealm-bastion/ --output out/github-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out/github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
