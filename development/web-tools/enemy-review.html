<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>心域防线 · 怪物结构与动作检查</title>
<style>
body{margin:0;background:#e5e5dd;color:#263239;font:16px 'Times New Roman','SimSun',serif}header{padding:12px 20px;background:#cbd8d1;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:21px;margin:0}button,select{font:inherit;padding:5px 10px}main{padding:16px}#status{margin:0 0 12px;font-size:14px}#sheet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}figure{margin:0;background:#d6dedb;border:1px solid #adbab5;border-radius:6px;overflow:hidden}figure canvas{width:100%;display:block;background:linear-gradient(145deg,#d7e0dc,#afbfb9)}figcaption{padding:5px 10px;font-size:14px}#live{display:flex;gap:16px;margin-top:16px;align-items:flex-start}#live canvas{max-width:50%;width:540px;background:#bacbc3}#details{flex:1;white-space:pre-wrap;font-size:15px}input{width:140px}

<header><h1>怪物结构与动作检查</h1><select id="enemy" aria-label="敌人"></select><select id="variant" aria-label="首领阶段"></select><select id="action" aria-label="动作"><option value="move">移动</option><option value="attack">攻击</option><option value="cast">能力</option><option value="idle">静止</option><option value="death">死亡</option></select><select id="stage" aria-label="能力进程"><option value="release">释放</option><option value="windup">预警</option></select><label><input id="moving-cast" type="checkbox" style="width:auto">施法时行进</label><button id="play">暂停</button><button id="sheet-button">当前模型关键帧</button><button id="group-button">当前批次对照</button></header>

<script type="module" src="/development/web-tests/helpers/enemy-review.mjs"></script></html>
